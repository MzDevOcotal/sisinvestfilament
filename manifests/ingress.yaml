apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: filament-app-ingress
  namespace: default
spec:
  ingressClassName: nginx              # <--- ESTO ES LO QUE FALTA
tls:
    - hosts:
        - investigaciones.mzdevocotal.com
      secretName: filament-tls-secret
rules:
    - host: investigaciones.mzdevocotal.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: filament-app-service
                port:
                  number: 80